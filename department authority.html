<script>
function deleteLeaderboard(){

localStorage.removeItem(
"leaderboard"
);

leaderboardData = [];

updateLeaderboard();

alert("Leaderboard Deleted");

}
</script>

<h3>Manual Leaderboard Entry</h3>

<input
id="leaderboardRank"
type="number"
placeholder="Rank">

<input
id="leaderboardNumber"
placeholder="Registration Number">

<input
id="leaderboardName"
placeholder="Participant Name">

<input
id="leaderboardScore"
type="number"
placeholder="Score">

<button onclick="addLeaderboard()">
Add Leaderboard Entry
</button>

<script>

function addLeaderboard(){

const rank =
document.getElementById(
"leaderboardRank"
).value;

const regNo =
document.getElementById(
"leaderboardNumber"
).value;

const name =
document.getElementById(
"leaderboardName"
).value;

const score =
document.getElementById(
"leaderboardScore"
).value;

if(
!rank ||
!regNo ||
!name ||
!score
){

alert(
"Fill all fields"
);

return;

}

leaderboardData.push({

rank:Number(rank),

registrationNumber:regNo,

name:name,

score:Number(score)

});

localStorage.setItem(
"leaderboard",
JSON.stringify(
leaderboardData
)
);

updateLeaderboard();

alert(
"Leaderboard Entry Added"
);

}

</script>

<div class="container">
</div>

</body>
